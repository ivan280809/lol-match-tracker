# Fail closed: a public demonstration, no proxy to private application routes.
# Switch to live consultation only after a reviewed application authorization change
# and approval of a Riot Production key. Keep the management port off the tunnel.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }
    location = / { root /usr/share/nginx/html; try_files /index.html =404; }
    location / { return 404; }
}
