name: lol-tracker

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:?An immutable image digest is required}
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DB_HOST: postgres
      DB_NAME: loltracker
      DB_USER: loltracker
      RIOT_API_REGION: EUROPE
      APP_POLL_ENABLED: "false"
      APP_POLL_MANUAL_ONLY: "true"
      APP_DASHBOARD_GUARD_ENABLED: "true"
      APP_DASHBOARD_GUARD_USERNAME: admin
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
    volumes:
      - ${DATA_ROOT:?Set an absolute data path}/secrets/app:/run/secrets:ro
    ports:
      - "127.0.0.1:${ADMIN_PORT:-18086}:8080"
    networks: [database, outbound]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  postgres:
    image: postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging: *logging
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: loltracker
      POSTGRES_USER: loltracker
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${DATA_ROOT}/secrets/app/spring.datasource.password:/run/secrets/db-password:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U loltracker -d loltracker"]
      interval: 10s
      timeout: 5s
      retries: 12

  public:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-18085}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./demo.html:/usr/share/nginx/html/index.html:ro
    networks: [outbound]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  database:
    internal: true
  outbound: {}

volumes:
  pgdata: {}
