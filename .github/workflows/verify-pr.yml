name: Verify pull request

on:
  pull_request:
    branches: [master, main]
  push:
    branches: ['codex/lolmatcher-*']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the Java target
        id: target
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          version = root.findtext('{*}properties/{*}java.version', '')
          if not re.fullmatch(r'[0-9]{2}', version):
              raise SystemExit('Missing numeric Java target')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('java=' + version + '\n')
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java }}
          cache: maven
      - name: Verify application and deployment policy
        run: |
          docker info
          chmod +x mvnw
          ./mvnw -B -ntp clean verify
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
          total = 0
          for report in reports:
              suite = ET.parse(report).getroot()
              total += int(suite.get('tests', '0'))
              if any(int(suite.get(key, '0')) for key in ('errors', 'failures', 'skipped')):
                  raise SystemExit('Failed or skipped tests: ' + report.name)
          if not reports or total == 0:
              raise SystemExit('No test results')
          print('Tests passed without omissions:', total)
          PY
          if test -d ops/minipc/tests; then
            python3 -m unittest discover -s ops/minipc/tests -v
          fi
      - name: Build the container without publishing
        run: docker build --tag lolmatcher-pr-check:${{ github.sha }} .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports-${{ github.sha }}
          path: target/surefire-reports/**
          if-no-files-found: error
          retention-days: 14
