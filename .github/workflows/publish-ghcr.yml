name: Publish GHCR Image and Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lol-match-tracker
  COMPOSE_PROJECT_NAME: lol-match-tracker
  DEPLOY_DIR: /opt/lol-match-tracker
  DEPLOY_ENV_FILE: /opt/lol-match-tracker/lol-tracker.env
  DEPLOY_COMPOSE_FILE: /opt/lol-match-tracker/docker-compose.deploy.yml

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    outputs:
      app-image: ${{ steps.image.outputs.app-image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B clean test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tags
        id: image
        run: echo "app-image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ steps.image.outputs.app-image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-minipc:
    runs-on: [self-hosted, linux, minipc]
    needs: test-and-publish
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    concurrency:
      group: minipc-deploy
      cancel-in-progress: false
    env:
      APP_IMAGE: ${{ needs.test-and-publish.outputs.app-image }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Validate mini PC prerequisites
        run: |
          command -v docker
          command -v curl
          docker compose version
          test -d "$DEPLOY_DIR"
          test -r "$DEPLOY_ENV_FILE"
          test -w "$DEPLOY_DIR"
          test ! -e "$DEPLOY_COMPOSE_FILE" || test -w "$DEPLOY_COMPOSE_FILE"

      - name: Copy Compose file to deployment directory
        run: cp docker-compose.deploy.yml "$DEPLOY_COMPOSE_FILE"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull deployment images
        run: docker compose --env-file "$DEPLOY_ENV_FILE" --file "$DEPLOY_COMPOSE_FILE" --project-name "$COMPOSE_PROJECT_NAME" pull

      - name: Restart application stack
        run: docker compose --env-file "$DEPLOY_ENV_FILE" --file "$DEPLOY_COMPOSE_FILE" --project-name "$COMPOSE_PROJECT_NAME" up -d --remove-orphans

      - name: Show deployment status
        run: docker compose --env-file "$DEPLOY_ENV_FILE" --file "$DEPLOY_COMPOSE_FILE" --project-name "$COMPOSE_PROJECT_NAME" ps

      - name: Wait for application health
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8085/actuator/health > /tmp/lol-match-tracker-health.json; then
              cat /tmp/lol-match-tracker-health.json
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file "$DEPLOY_ENV_FILE" --file "$DEPLOY_COMPOSE_FILE" --project-name "$COMPOSE_PROJECT_NAME" logs --tail=120 lol-match-tracker
          exit 1
