spring.application.name=lol-match-tracker
server.port=${SERVER_PORT:8080}

riot.api.key=${RIOT_API_KEY:}
riot.api.region=${RIOT_API_REGION:EUROPE}
app.poll.fixed-delay=${APP_POLL_FIXED_DELAY:PT5M}
app.poll.initial-delay=${APP_POLL_INITIAL_DELAY:PT30S}
app.poll.scheduler-tick=${APP_POLL_SCHEDULER_TICK:PT30S}
app.poll.enabled=${APP_POLL_ENABLED:true}
app.poll.manual-only=${APP_POLL_MANUAL_ONLY:false}
app.poll.match-window-size=${APP_POLL_MATCH_WINDOW_SIZE:10}
app.poll.pagination-limit=${APP_POLL_PAGINATION_LIMIT:3}
app.config.encryption-key=${APP_CONFIG_ENCRYPTION_KEY:}
app.http.timeout=${APP_HTTP_TIMEOUT:PT10S}
app.http.connect-timeout=${APP_HTTP_CONNECT_TIMEOUT:${APP_HTTP_TIMEOUT:PT10S}}
app.http.retry.max-attempts=${APP_HTTP_RETRY_MAX_ATTEMPTS:3}
app.http.retry.backoff=${APP_HTTP_RETRY_BACKOFF:PT1S}
app.time.zone=${APP_TIME_ZONE:Europe/Madrid}
app.dashboard.guard.enabled=${APP_DASHBOARD_GUARD_ENABLED:false}
app.dashboard.guard.username=${APP_DASHBOARD_GUARD_USERNAME:${APP_DASHBOARD_USERNAME:admin}}
app.dashboard.guard.password=${APP_DASHBOARD_GUARD_PASSWORD:${APP_DASHBOARD_PASSWORD:}}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:micros}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.chat.id=${TELEGRAM_CHAT_ID:}

management.endpoints.web.exposure.include=health,info,metrics
