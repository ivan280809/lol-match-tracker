<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${'Editar ' + player.displayName()}">Editar jugador</title>
  <style>
    :root { --void:#080a0f; --rift:#101824; --panel:#141d29; --gold:#c8a65d; --gold-bright:#f0d28a; --text:#f1efe6; --muted:#9ba9b9; --quiet:#6d7b8b; --line:rgba(216,190,124,0.18); --red-soft:#3a1d24; --green-soft:#123429; --shadow:0 18px 42px rgba(0,0,0,0.34); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(180deg,var(--void),var(--rift)); color:var(--text); font-family:"Segoe UI",Arial,Helvetica,sans-serif; font-size:15px; line-height:1.45; }
    .page { width:min(820px,calc(100% - 32px)); margin:0 auto; padding:24px 0 40px; }
    .panel { border:1px solid var(--line); border-radius:8px; background:rgba(20,29,41,0.94); box-shadow:var(--shadow); padding:20px; display:grid; gap:16px; }
    h1,p { margin:0; letter-spacing:0; }
    h1 { font-size:clamp(1.8rem,4vw,3rem); line-height:1; }
    a { color:var(--gold-bright); text-decoration:none; font-weight:900; }
    .muted { color:var(--muted); }
    form { display:grid; gap:16px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { display:grid; gap:6px; color:var(--muted); font-size:.8rem; font-weight:900; text-transform:uppercase; }
    input[type="text"], select { width:100%; min-height:46px; border:1px solid rgba(155,169,185,.32); border-radius:6px; padding:10px 12px; background:rgba(8,10,15,.64); color:var(--text); }
    .check-row { display:flex; align-items:center; gap:8px; color:var(--text); text-transform:none; }
    .actions { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; }
    button, .button { min-height:42px; border:1px solid rgba(155,169,185,.26); border-radius:6px; padding:10px 14px; background:rgba(255,255,255,.05); color:var(--text); font-weight:900; cursor:pointer; }
    .button-primary { border-color:rgba(240,210,138,.35); background:linear-gradient(180deg,#d8b86b,#9f7c35); color:#11151c; }
    .field-error, .global-error { color:#ffb7b7; font-size:.8rem; font-weight:900; }
    .global-error { border:1px solid rgba(208,90,90,.42); border-radius:8px; background:var(--red-soft); padding:10px; }
    .messages { position:fixed; z-index:20; top:18px; right:18px; width:min(420px,calc(100% - 36px)); display:grid; gap:8px; }
    .message { border-radius:8px; padding:12px 14px; font-weight:800; border:1px solid; box-shadow:var(--shadow); }
    .success { color:#c9f5dc; background:var(--green-soft); border-color:rgba(73,181,125,.38); }
    .error { color:#ffd0d0; background:var(--red-soft); border-color:rgba(208,90,90,.42); }
    @media (max-width:720px) { .grid { grid-template-columns:1fr; } .actions { align-items:stretch; flex-direction:column; } button,.button { width:100%; text-align:center; } }
  </style>
</head>
<body>
<main class="page">
  <div class="messages">
    <div th:if="${successMessage}" class="message success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="message error" th:text="${errorMessage}"></div>
  </div>

  <section class="panel">
    <div>
      <p class="muted">Editar jugador</p>
      <h1 th:text="${player.displayName()}">Player#TAG</h1>
    </div>

    <form th:action="@{'/players/' + ${player.id}}" method="post" th:object="${playerForm}">
      <div class="global-error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</div>
      <div class="grid">
        <label for="platform">Servidor
          <select id="platform" th:field="*{platform}">
            <option th:each="platform : ${riotPlatforms}" th:value="${platform.name()}" th:text="${platform.shortName() + ' - ' + platform.displayName()}"></option>
          </select>
        </label>
        <label for="gameName">Nombre
          <input id="gameName" type="text" th:field="*{gameName}">
          <span class="field-error" th:if="${#fields.hasErrors('gameName')}" th:errors="*{gameName}"></span>
        </label>
        <label for="tagLine">Tag de Riot ID
          <input id="tagLine" type="text" th:field="*{tagLine}">
          <span class="field-error" th:if="${#fields.hasErrors('tagLine')}" th:errors="*{tagLine}"></span>
        </label>
      </div>
      <label class="check-row">
        <input type="checkbox" th:field="*{active}">
        Activo si no esta archivado
      </label>
      <label class="check-row">
        <input type="checkbox" th:field="*{backfill}">
        Importar historial anterior sin avisos en el proximo poll
      </label>
      <div class="actions">
        <a class="button" th:href="@{'/players/' + ${player.id}}">Cancelar</a>
        <div class="actions">
          <input type="hidden" name="returnTo" th:value="@{'/players/' + ${player.id} + '/edit'}">
          <button type="submit" th:formaction="@{/players/validate-account}">Validar cuenta Riot</button>
          <button class="button-primary" type="submit">Guardar cambios</button>
        </div>
      </div>
    </form>
  </section>
</main>
</body>
</html>
