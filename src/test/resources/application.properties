spring.datasource.url=jdbc:h2:mem:loltracker-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.task.scheduling.enabled=false
telegram.bot.token=test-token
telegram.chat.id=test-chat
riot.api.key=test-key
riot.api.region=EUROPE
app.config.encryption-key=test-encryption-key
app.poll.initial-delay=PT1000H
app.poll.scheduler-tick=PT1000H
app.poll.enabled=true
app.poll.manual-only=false
app.poll.match-window-size=10
app.poll.pagination-limit=3
app.http.timeout=PT5S
app.http.connect-timeout=PT5S
app.http.retry.max-attempts=1
app.http.retry.backoff=PT0.1S
app.time.zone=Europe/Madrid
app.dashboard.guard.enabled=false
app.dashboard.guard.username=admin
app.dashboard.guard.password=
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,metrics
