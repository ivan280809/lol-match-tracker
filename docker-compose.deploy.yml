services:
  lol-match-tracker:
    image: ${APP_IMAGE:-ghcr.io/ivan280809/lol-match-tracker:latest}
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-micros}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      RIOT_API_KEY: ${RIOT_API_KEY}
      RIOT_API_REGION: ${RIOT_API_REGION:-EUROPE}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      APP_CONFIG_ENCRYPTION_KEY: ${APP_CONFIG_ENCRYPTION_KEY}
      APP_POLL_FIXED_DELAY: ${APP_POLL_FIXED_DELAY:-PT5M}
      APP_POLL_INITIAL_DELAY: ${APP_POLL_INITIAL_DELAY:-PT30S}
      APP_POLL_SCHEDULER_TICK: ${APP_POLL_SCHEDULER_TICK:-PT30S}
      APP_POLL_ENABLED: ${APP_POLL_ENABLED:-true}
      APP_POLL_MANUAL_ONLY: ${APP_POLL_MANUAL_ONLY:-false}
      APP_POLL_MATCH_WINDOW_SIZE: ${APP_POLL_MATCH_WINDOW_SIZE:-10}
      APP_POLL_PAGINATION_LIMIT: ${APP_POLL_PAGINATION_LIMIT:-3}
      APP_HTTP_TIMEOUT: ${APP_HTTP_TIMEOUT:-PT10S}
      APP_HTTP_CONNECT_TIMEOUT: ${APP_HTTP_CONNECT_TIMEOUT:-PT10S}
      APP_HTTP_RETRY_MAX_ATTEMPTS: ${APP_HTTP_RETRY_MAX_ATTEMPTS:-3}
      APP_HTTP_RETRY_BACKOFF: ${APP_HTTP_RETRY_BACKOFF:-PT1S}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Madrid}
    ports:
      - "${APP_PORT_BIND:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-micros}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
